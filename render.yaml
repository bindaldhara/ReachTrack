# Render Blueprint — deploy API on the free plan
# Dashboard: New → Blueprint → connect repo → set secret env vars manually

services:
  - type: web
    name: reachtrack-api
    runtime: python
    # Leave Root Directory blank in the Render dashboard (repo root).
    # Do not set it to `web` — that makes Render look for `web/api`, which fails.
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"


